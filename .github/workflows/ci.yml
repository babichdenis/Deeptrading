name: CI

on:
  push:
    branches: [master, main, second, audit-fixes-2026-09-18]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.9,<1"
      - name: Compile check (синтаксис)
        run: |
          python -m compileall -q app scripts
      - name: Ruff check
        # Линт не блокирует (в легаси-кодpе есть долг); это сигнал.
        continue-on-error: true
        run: python -m ruff check app scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deeptrading
          POSTGRES_PASSWORD: deeptrading
          POSTGRES_DB: deeptrading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deeptrading" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: deeptrading
      POSTGRES_PASSWORD: deeptrading
      POSTGRES_DB: deeptrading
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
      - name: Run tests
        # Тесты, не требующие T-Invest API (эндпойнты мокаются/кэшируются).
        run: pytest -q --tb=short -x