services:
  postgres:
    image: postgres:16-alpine
    container_name: deeptrading-postgres
    environment:
      POSTGRES_USER: deeptrading
      POSTGRES_PASSWORD: deeptrading
      POSTGRES_DB: deeptrading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptrading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
